front_matter:
  - title: 'Dedication Page'
    page: 1
    prefix: 'front'
    include_bible: false
    include_safety: false
    source_image: 'src/scene_packs/dragon_realm/dedication_template01.png'

    overlays:
      - type: 'text'
        style: 'dedication'
        content: '{{ dedication_text }}'
        region_pct: { x: 15, y: 38, w: 70, h: 24 }

# ============================================================
# SCENES
# ============================================================

scenes:
  - page: 2
    title: 'Entering the Dragon Realm'
    prompt: |
      
      SCENE:
      {{ human_02 }} pulls {{ human_01 }} by the hand through a swirling magical portal.
      {{ companion }} leaps through between their legs.
      Strange glowing plants and distant mountains on the other side.

    single_child_prompt: |
      
      SCENE:
      {{ human_01 }} leaps through a swirling magical portal, arms wide.
      {{ companion }} dives through alongside them.
      Strange glowing plants and distant mountains on the other side.

    no_pet_prompt: |
      
      SCENE:
      {{ human_02 }} pulls {{ human_01 }} by the hand through a swirling magical portal.
      Strange glowing plants and distant mountains on the other side.

    single_child_no_companion_prompt: |
      
      SCENE:
      {{ human_01 }} leaps through a swirling magical portal, arms wide.
      Strange glowing plants and distant mountains on the other side.

  - page: 3
    title: 'Dragon Hatchling'
    prompt: |
      
      SCENE:
      {{ human_01 }} and {{ human_02 }} crouch over a nest of cracking dragon eggs.
      A tiny dragon head pokes out of one egg reaching toward {{ human_01 }}'s finger.
      {{ companion }} peers in from behind them.

    single_child_prompt: |
      
      SCENE:
      {{ human_01 }} crouches over a nest of cracking dragon eggs, finger gently extended.
      A tiny dragon head pokes out of one egg reaching toward them.
      {{ companion }} peers in from behind.

    no_pet_prompt: |
      
      SCENE:
      {{ human_01 }} and {{ human_02 }} crouch over a nest of cracking dragon eggs.
      A tiny dragon head pokes out of one egg reaching toward {{ human_01 }}'s finger.

    single_child_no_companion_prompt: |
      
      SCENE:
      {{ human_01 }} crouches over a nest of cracking dragon eggs, finger gently extended.
      A tiny dragon head pokes out of one egg reaching toward them.

  - page: 4
    title: 'The Grateful Hatchling'
    prompt: |
      
      SCENE:
      A baby dragon is pinned under a large fallen log, one wing trapped.
      {{ human_01 }} pushes both hands under the log to lift it, expression showing focused concern and determination — NOT anger or aggression.
      {{ human_02 }} crouches beside the dragon, carefully easing it free.
      The baby dragon looks up at them with grateful eyes.
      {{ companion }} stands close, watching intently.

    single_child_prompt: |
      
      SCENE:
      A baby dragon is pinned under a large fallen log, one wing trapped.
      {{ human_01 }} pushes both hands under the log to lift it, face showing gentle determination and concern, while easing the dragon free.
      The baby dragon looks up at them with grateful eyes.
      {{ companion }} stands close, watching intently.

    no_pet_prompt: |
      
      SCENE:
      A baby dragon is pinned under a large fallen log, one wing trapped.
      {{ human_01 }} pushes both hands under the log to lift it, expression showing focused concern and determination — NOT anger or aggression.
      {{ human_02 }} crouches beside the dragon, carefully easing it free.
      The baby dragon looks up at them with grateful eyes.

    single_child_no_companion_prompt: |
      
      SCENE:
      A baby dragon is pinned under a large fallen log, one wing trapped.
      {{ human_01 }} pushes both hands under the log to lift it, face showing gentle determination and concern, while easing the dragon free.
      The baby dragon looks up at them with grateful eyes.

  - page: 5
    title: 'Dragon Training'
    prompt: |
      
      SCENE:
      The baby dragon hovers in the air, wings beating hard, having just obeyed a command to fly.
      {{ human_01 }} pumps a fist in the air cheering, delighted it worked.
      {{ human_02 }} claps excitedly beside them.
      {{ companion }} barks up at the dragon encouragingly.

    single_child_prompt: |
      
      SCENE:
      The baby dragon hovers in the air, wings beating hard, having just obeyed a command to fly.
      {{ human_01 }} pumps a fist in the air cheering, delighted it worked.
      {{ companion }} barks up at the dragon encouragingly.

    no_pet_prompt: |
      
      SCENE:
      The baby dragon hovers in the air, wings beating hard, having just obeyed a command to fly.
      {{ human_01 }} pumps a fist in the air cheering, delighted it worked.
      {{ human_02 }} claps excitedly beside them.

    single_child_no_companion_prompt: |
      
      SCENE:
      The baby dragon hovers in the air, wings beating hard, having just obeyed a command to fly.
      {{ human_01 }} pumps a fist in the air cheering, delighted it worked.

  - page: 6
    title: 'Preparing for Adventure'
    prompt: |
      
      SCENE:
      A baby dragon wears a tiny crooked helmet and oversized armor, trying to look brave.
      {{ human_01 }} and {{ human_02 }} laugh, trying to straighten the gear.
      {{ companion }} watches with head tilted.

    single_child_prompt: |
      
      SCENE:
      A baby dragon wears a tiny crooked helmet and oversized armor, trying to look brave.
      {{ human_01 }} laughs, trying to straighten the gear.
      {{ companion }} watches with head tilted.

    no_pet_prompt: |
      
      SCENE:
      A baby dragon wears a tiny crooked helmet and oversized armor, trying to look brave.
      {{ human_01 }} and {{ human_02 }} laugh, trying to straighten the gear.

    single_child_no_companion_prompt: |
      
      SCENE:
      A baby dragon wears a tiny crooked helmet and oversized armor, trying to look brave.
      {{ human_01 }} laughs, trying to straighten the gear.

  - page: 7
    title: 'The First Greeting'
    prompt: |
      
      SCENE:
      Camera sits behind and above the dragon's neck, looking down over its shoulder.
      The dragon's head and the curve of its neck fill the upper portion of the page, seen from behind.
      Far below, {{ human_01 }} and {{ human_02 }} are tiny figures on the ground,
      faces tilted up toward the dragon, expressions full of wonder.
      {{ companion }} sits close between them, also looking up.
      The scale difference is enormous and breathtaking.

    single_child_prompt: |
      
      SCENE:
      Camera sits behind and above the dragon's neck, looking down over its shoulder.
      The dragon's head and the curve of its neck fill the upper portion of the page, seen from behind.
      Far below, {{ human_01 }} is a tiny figure on the ground,
      face tilted up toward the dragon, full of wonder.
      {{ companion }} sits close beside them, also looking up.
      The scale difference is enormous and breathtaking.

    no_pet_prompt: |
      
