      Far below, {{ human_01 }} and {{ human_02 }} are tiny figures on the ground,
      faces tilted up toward the dragon, expressions full of wonder.
      The scale difference is enormous and breathtaking.

    single_child_no_companion_prompt: |
      
      SCENE:
      Camera sits behind and above the dragon's neck, looking down over its shoulder.
      The dragon's head and the curve of its neck fill the upper portion of the page, seen from behind.
      Far below, {{ human_01 }} is a tiny figure on the ground,
      face tilted up toward the dragon, full of wonder.
      The scale difference is enormous and breathtaking.

  - page: 8
    title: 'The Sky Bridge'
    prompt: |
      
      SCENE:
      {{ human_01 }} tiptoes across a narrow floating stone bridge high above the clouds, arms out for balance.
      {{ human_02 }} follows close behind, peeking down at the drop.
      {{ companion }} scrambles ahead, tail straight up.
      A dragon flies alongside the bridge, keeping pace with them.

    single_child_prompt: |
      
      SCENE:
      {{ human_01 }} tiptoes across a narrow floating stone bridge high above the clouds, arms out for balance.
      {{ companion }} scrambles ahead, tail straight up.
      A dragon flies alongside the bridge, keeping pace with them.

    no_pet_prompt: |
      
      SCENE:
      {{ human_01 }} tiptoes across a narrow floating stone bridge high above the clouds, arms out for balance.
      {{ human_02 }} follows close behind, peeking down at the drop.
      A dragon flies alongside the bridge, keeping pace with them.

    single_child_no_companion_prompt: |
      
      SCENE:
      {{ human_01 }} tiptoes across a narrow floating stone bridge high above the clouds, arms out for balance.
      A dragon flies alongside the bridge, keeping pace with them.

  - page: 9
    title: 'The Thunder Dragon'
    prompt: |
      
      SCENE:
      A massive thunder dragon with crackling lightning around its wings soars overhead.
      {{ human_01 }} throws both arms up cheering into the wind.
      {{ human_02 }} and {{ companion }} shelter behind the young dragon, peeking out.

    single_child_prompt: |
      
      SCENE:
      A massive thunder dragon with crackling lightning around its wings soars overhead.
      {{ human_01 }} throws both arms up cheering into the wind.
      {{ companion }} presses close to them, wide-eyed.

    no_pet_prompt: |
      
      SCENE:
      A massive thunder dragon with crackling lightning around its wings soars overhead.
      {{ human_01 }} throws both arms up cheering into the wind.
      {{ human_02 }} shelters behind the young dragon, peeking out.

    single_child_no_companion_prompt: |
      
      SCENE:
      A massive thunder dragon with crackling lightning around its wings soars overhead.
      {{ human_01 }} throws both arms up cheering into the wind.

  - page: 10
    title: 'The Ancient Dragon'
    prompt: |
      
      SCENE:
      An enormous ancient dragon lowers its massive head toward the ground in greeting.
      {{ human_01 }} and {{ human_02 }} stare up at it, mouths open in awe.
      {{ companion }} freezes between their feet, staring straight up.

    single_child_prompt: |
      
      SCENE:
      An enormous ancient dragon lowers its massive head toward the ground in greeting.
      {{ human_01 }} stares up at it, mouth open in awe.
      {{ companion }} freezes at their feet, staring straight up.

    no_pet_prompt: |
      
      SCENE:
      An enormous ancient dragon lowers its massive head toward the ground in greeting.
