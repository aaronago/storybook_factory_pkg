      An enormous ancient dragon lowers its massive head toward the ground in greeting.
      {{ human_01 }} stares up at it, mouth open in awe.

  - page: 11
    title: 'Frostfall Peaks'
    prompt: |
      
      SCENE:
      View from behind {{ human_01 }} and {{ human_02 }} — we see their backs as small figures
      standing at the edge of a snowy cliff, facing an enormous ice dragon perched on the peak opposite.
      The dragon fills the upper two-thirds of the page, scales shimmering like ice crystals,
      exhaling a slow breath of glittering frost across the chasm.
