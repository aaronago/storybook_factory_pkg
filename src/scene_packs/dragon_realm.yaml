# ============================================================
# DRAGON REALM SCENE PACK (DRY + MACRO VERSION)
# Requires: 1–2 children, 0–1 pets
# Scenes are written for 2 children + 1 pet.
# With 1 child, child_2 falls back to child_1 (same name used twice — scene still renders).
# With 0 pets, pet_1 falls back to "their pet" — omit pet lines manually if needed.
# ============================================================

globals:
  # ------------------------------------------------------------
  # Global safety (auto-injected by generator)
  # ------------------------------------------------------------
  global_safety_rules: |
    - No words, letters, symbols, or text of any kind anywhere in the image.

  # ------------------------------------------------------------
  # Style fragments
  # ------------------------------------------------------------
  cover_art_style: |
    Full-color, premium children’s fantasy book cover illustration.
    High-end animated feature film lighting (Pixar-style fantasy cool).

    COLOR DIRECTION:
    - World lighting = cool twilight blues, indigo, and soft violet.
    - Shadows lean blue-violet or teal, NOT brown or orange.
    - Portal glow = warm golden key light with soft falloff.
    - Strong warm–cool contrast between portal light and forest atmosphere.
    - Background should feel cool and magical, not sepia or sunset-orange.

    LIGHTING STYLE:
    - Cinematic global illumination.
    - Soft rim lighting separating characters from background.
    - Subtle cool moonlight or sky fill balancing the warm portal light.
    - Warm light affects only nearby surfaces; avoid flooding entire scene with orange.

    RENDERING:
    - Painterly but polished.
    - Smooth gradients and volumetric glow.
    - No heavy black contour lines.
    - Edges defined by light and color transitions, not outlines.

    HARD RULES:
    - NOT a coloring book page.
    - No outline-only rendering.
    - No large white fill areas.
    - Maintain full color depth and dynamic lighting.

    Expressive faces.
    Modern animated-feature aesthetic.
    No watermark.

  # Keep predictable negative space for typography
  cover_comp_rules: |
    Provide clear negative space for typography:
    - Leave the top ~25% of the FRONT cover as mostly open sky/glow (low detail).
    - Do NOT draw frames, rectangles, title boxes, or bordered placeholders.
    - Do NOT draw any letters/words/symbols or fake text scribbles anywhere.

  # ------------------------------------------------------------
  # Composition fragments
  # ------------------------------------------------------------
  comp_medium_close: |
    FULL-PAGE COMPOSITION: medium-close character-focused framing.
    The children are the primary focus of the illustration.

    {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
    occupy roughly the lower 75–80% of the page.

    Leave open space above for environment elements.
    Avoid pushing the characters too far from the viewer.

  comp_vertical_dynamic: |
    FULL-PAGE COMPOSITION: dynamic vertical composition.
    {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
    fill most of the lower two-thirds.
    Key elements extend upward toward the top edge.

  comp_epic_upward: |
    FULL-PAGE COMPOSITION: dramatic upward composition.
    Main dragon wings extend near the top margin.
    Characters fill the lower half prominently.

  comp_flight_diagonal: |
    FULL-PAGE COMPOSITION: dynamic diagonal composition.
    One MAIN dragon fills ~80–85% of page height.
    Wings extend near the top margin (partial crop OK).

  # ------------------------------------------------------------
  # Front-matter overlay styles (auto-injected by generator)
  # ------------------------------------------------------------

  overlay_styles:
    dedication:
      font_path: 'assets/fonts/CormorantGaramond-Italic-VariableFont_wght.ttf'
      size: 145
      fill: 'black'
      stroke_width: 1
      stroke_fill: 'white'
      line_spacing: 1.18

  # ------------------------------------------------------------
  # One-line reusable scene header (MOST IMPORTANT)
  # ------------------------------------------------------------
  style_line_art: |
    clean black ink line drawing suitable for coloring
    Clean black outlines on white.
    No shading, no gray, no gradients, no shadows.
    Avoid large filled-black regions; keep interiors open for coloring.

  style_classic: |
    Avoid exaggerated cartoon faces or oversized eyes.
    Preserve the real facial proportions from the reference images.

  style_action: |
    STYLE: Preserve the real facial proportions from the reference images.
    gentle action energy, but keep shapes simple and readable.

  style_emotional: |
    STYLE: Children should show clear emotion and movement.
    Avoid stiff standing poses.
    Use expressive body language such as pointing,
    leaning, running, kneeling, reaching, or reacting.

  base_scene_header: |
    {{ globals.style_line_art }}
    {{ globals.style_classic }}
    {{ globals.style_emotional }}
    {{ globals.comp_medium_close }}

  base_scene_header_vertical: |
    {{ globals.style_line_art }}
    {{ globals.style_classic }}
    {{ globals.style_emotional }}
    {{ globals.comp_vertical_dynamic }}

  base_scene_header_action: |
    {{ globals.style_line_art }}
    {{ globals.style_action }}
    {{ globals.style_emotional }}
    {{ globals.comp_vertical_dynamic }}

  base_scene_header_epic: |
    {{ globals.style_line_art }}
    {{ globals.style_classic }}
    {{ globals.style_emotional }}
    {{ globals.comp_epic_upward }}

  base_scene_header_flight: |
    {{ globals.style_line_art }}
    {{ globals.style_action }}
    {{ globals.style_emotional }}
    {{ globals.comp_flight_diagonal }}

covers:
  front:
    title: 'Front Cover Art'
    prefix: 'cover'
    include_bible: true
    include_safety: true
    pixels: { w: 2588, h: 3375 }
    prompt: |
      {{ globals.cover_art_style }}

      Rendering must feel like a frame from a high-end animated fantasy film.

      FRONT COVER SCENE:
      {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }} in the foreground,
      discovering a swirling magical portal in a forest clearing.
      A large friendly dragon rises protectively behind them,
      wings subtly framing the composition.
      A distant castle silhouette beyond the trees.

      LIGHTING:
      The forest environment should be cool twilight blue and indigo.
      Add subtle cool moonlight or sky glow from above/behind.
      The portal emits a soft golden magical light that illuminates faces and nearby ground.
      Keep warm light localized — do NOT turn the entire scene orange.
      Add gentle cool-violet shadow tones in unlit areas.
      Add slight teal undertones in darker forest areas for depth.

      ATMOSPHERE:
      Soft volumetric glow around the portal.
      Light mist or particles catching cool blue light in the distance.
      Maintain strong warm–cool color separation.

      COMPOSITION:
      Subjects fill the lower ~65–70% of the cover.
      Reserve the upper ~30–35% as open cool-toned sky for title placement.
      Keep this upper area clean and uncluttered (no branches or wings behind text).

      TITLE PLACEMENT RULES:
      Include the exact title text:
      The Dragon Realm Adventure

      The title must sit comfortably inside the safe zone.
      Leave a generous clear margin above the word "The".
      The top of the title block must not approach the trim edge.
      Ensure visible breathing room between the top of the cover and the title.

      Center the title horizontally in the upper sky area.
      Position the entire title block slightly lower than the very top —
      never tight to the edge.

      Use elegant fantasy serif typography.
      Gold-ivory lettering with subtle bevel and soft warm glow.
      Professional book-cover quality.
      Clean, readable letterforms.
      Correct spelling is critical.
      Do not distort letters.
      Do not add extra words.
      No other text anywhere on the cover.

      Do NOT draw placeholder boxes or frames.
      Do NOT draw fake lettering or symbols.

  back:
    title: 'Back Cover Art'
    prefix: 'cover'
    include_bible: false
    include_safety: true
    pixels: { w: 2588, h: 3375 }
    prompt: |
      {{ globals.cover_art_style }}

      BACK COVER SCENE:
      A whimsical magical dragon-realm landscape suitable for the back cover.
      Rolling hills, distant castle silhouette, glowing stars,
      subtle magical particles in the air, and gentle twilight sky.
      Include soft atmospheric depth and rich color, but keep composition calm and balanced.

      Leave the central area moderately open in case a small blurb is added later.
      Do NOT include the children or pets on the back cover.
      Do NOT draw any text.
      Do NOT draw placeholder boxes or frames.

front_matter:
  - title: 'Dedication Page'
    page: 1
    prefix: 'front'
    include_bible: false
    include_safety: false
    prompt: |
      Black-and-white coloring-book line art. Clean outlines only. No shading.
      Leave a very large blank center area for dedication text (DO NOT draw text).
      Add a simple thin border of vines and stars.
      IMPORTANT: Do NOT draw any letters/words/symbols. Keep center blank.

    overlays:
      - type: 'text'
        style: 'dedication'
        content: "For {{ child_names|join(' & ') }}—\nmay your imaginations always soar."
        region_pct: { x: 15, y: 38, w: 70, h: 24 }

# ============================================================
# SCENES
# ============================================================

scenes:
  - page: 2
    title: 'Entering the Dragon Realm'
    prompt: |

      SCENE:
      {{ child_2 }} has both feet planted through the portal and is hauling
      {{ child_1 }} forward by the hand, leaning back with all her weight.
      {{ child_1 }}'s free arm trails behind, fingers splayed wide, heels dragging.
      {{ pet_1 }} launches through the portal between their legs,
      ears pinned back, all four paws off the ground.
      Strange plants and distant mountains glow on the other side.

    single_child_prompt: |

      SCENE:
      {{ child_1 }} stands at the swirling portal, one foot already through,
      leaning back to grab {{ pet_1 }}'s collar with both hands.
      {{ pet_1 }} strains forward eagerly into the portal, all four paws scrabbling,
      ears pinned back, tail a blur.
      Strange plants and distant mountains glow on the other side.

  - page: 3
    title: 'Dragon Hatchling'
    prompt: |

      SCENE:
      One baby dragon peeks out from a cracked shell.
      The hatchling looks curious and friendly.
      {{ child_names|join(' & ') }} kneel down to get a closer look,
      while {{ pet_1 }} watches closely.

  - page: 4
    title: 'The Grateful Hatchling'
    prompt: |

      SCENE:
      The baby dragon has just been freed from tangled forest vines.
      The dragon happily nuzzles against them
      as the children gently hug the small dragon.
      One child laughs while the other pets the dragon's head.
      {{ pet_1 }} stands nearby wagging excitedly.
      Broken vines lie on the ground.
  - page: 5
    title: 'Dragon Training'
    prompt: |

      SCENE:
      {{ child_1 }} stands a few feet away with both arms raised,
      coaxing the baby dragon to fly over.
      The hatchling launches off a mossy log, wings pumping hard,
      wobbling through the air toward {{ child_1 }}.
      {{ child_2 }} crouches behind the log cheering with fists raised.
      {{ pet_1 }} sprints in a circle beneath the dragon, barking upward.

  - page: 6
    title: 'The Forest Guardian'
    prompt: |

      SCENE:
      A majestic forest dragon emerges from behind tall trees,
      its leaf-like wings spreading wide as it steps forward.
      The baby dragon scurries between {{ child_names|join(' & ') }} and the guardian,
      pressing itself against their legs.
      {{ child_1 }} steps forward with one hand outstretched toward the great dragon
      while {{ child_2 }} grabs {{ child_1 }}'s sleeve, pulling back slightly.
      {{ pet_1 }} presses close to {{ child_2 }}'s feet, ears flat, tail tucked.

  - page: 7
    title: 'Dragon Nap'
    prompt: |

      SCENE:
      The young dragon has fallen deeply asleep draped across {{ child_1 }}'s lap,
      pinning them completely to the ground.
      {{ child_1 }} looks helplessly at {{ child_2 }}, arms out to the sides, unable to move.
      {{ child_2 }} crouches beside them, hands under the dragon's middle,
      trying to lift it with a strained expression — the dragon doesn't budge.
      {{ pet_1 }} sits next to the dragon's tail, watching {{ child_2 }} struggle,
      head tilted sideways.

    single_child_prompt: |

      SCENE:
      The young dragon has fallen deeply asleep draped across {{ child_1 }}'s lap,
      pinning them completely to the ground.
      {{ child_1 }} looks down at the dragon, arms out to the sides, completely stuck,
      expression a mix of helpless and fond.
      {{ pet_1 }} sits next to the dragon's tail, head tilted sideways,
      making no effort whatsoever to help.

  - page: 8
    title: 'The Sky Bridge'
    prompt: |
      SCENE:
      {{ child_1 }} edges across a floating stone bridge,
      arms out for balance, one foot testing each stone.
      {{ child_2 }} crouches behind, peering through the gaps at the clouds swirling far below.
      {{ pet_1 }} scrambles forward on the bridge, claws scrabbling on the stone, nose to the edge.
      The young dragon swoops low overhead, neck craning back to check on them.

  - page: 9
    title: 'The Thunder Dragon'
    prompt: |

      SCENE:
      Storm clouds churn above a rocky hill.
      {{ child_1 }} plants both feet wide and throws both arms up toward the sky,
      shouting into the wind.
      {{ child_2 }} crouches low behind the young dragon, hands on its side, peeking around its shoulder.
      {{ pet_1 }} barks up at the storm, front paws raised off the ground.
      A powerful thunder dragon banks hard across the sky above,
      lightning crackling around its wings.

  - page: 10
    title: 'The Ancient Dragon'
    prompt: |

      SCENE:
      Before a massive ancient stone gate covered in carved dragon runes,
      an enormous ancient dragon rests with its wings folded,
      head lowered slowly toward the ground as if greeting them.
      The dragon is so large its head alone fills most of the frame above the children.
      {{ child_1 }} stands completely still, head tilted all the way back, mouth open in awe.
      {{ child_2 }} grabs {{ child_1 }}'s arm with both hands, leaning into them,
      equally stunned and amazed.
      {{ pet_1 }} sits frozen between their feet, staring straight up, ears perked forward.

  - page: 11
    title: 'Frostfall Peaks'
    prompt: |

      SCENE:
      High in snowy mountains,
      {{ child_names|join(' & ') }} climb a gentle icy slope.
      A majestic ice dragon perches on a frozen ridge above them.
      Snowdrifts and ice formations surround the scene.

  - page: 12
    title: 'The Ocean Dragon'
    prompt: |

      SCENE:
      A wave crashes onto the shore, spraying foam around {{ child_1 }}'s feet
      as {{ child_1 }} leaps back laughing, arms thrown wide.
      {{ child_2 }} kneels at the water's edge, reaching one hand toward
      the ocean dragon as it surges up from the surf, neck arching forward.
      {{ pet_1 }} bolts away from the wave, kicking up wet sand.

  - page: 13
    title: 'Dragon BBQ'
    prompt: |

      SCENE:
      A friendly dragon wearing a comically oversized chef's hat breathes a small flame
      onto skewered food balanced on a flat rock grill.
      {{ child_1 }} holds a plate up eagerly, mouth open.
      {{ child_2 }} sneaks a piece off the rock with a sideways grin.
      {{ pet_1 }} sits directly beneath the grill, drooling, staring up.
      Bright daylight, open sky behind them.

  - page: 14
    title: 'Dragon Flight'
    prompt: |

      SCENE:
      {{ child_names|join(' & ') }} ride together on their dragon friend.
      The dragon soars high above valleys and rivers.
      Hair and clothing flow in the wind.
      Far below,
      {{ pet_1 }} runs along a winding path.

  - page: 15
    title: 'The Dragon Festival'
    prompt: |

      SCENE:
      In a wide dragon-realm valley where dragons of many shapes have gathered for a joyful festival,
      {{ child_1 }} sprints toward a small dragon, arms wide open for a hug,
      one foot leaving the ground mid-stride.
      {{ child_2 }} stands with feet dangling off the ground, sitting on the flat top of a dragon's snout
      as the dragon slowly raises its head upward — {{ child_2 }}'s arms spread wide, laughing with delight.
      {{ pet_1 }} leaps into the air, all four paws off the ground, tail a blur.
      Colorful banners and lanterns hang between tall stone pillars.
      Avoid crowding the central characters.

  - page: 16
    title: 'Goodbye Dragon Realm'
    prompt: |
      {{ globals.base_scene_header }}

      SCENE:
      Back at the glowing portal, the dragon lowers its head all the way to the ground,
      pressing its snout gently against {{ child_1 }}'s cheek.
      {{ child_1 }} wraps both arms around the dragon's nose, eyes shut tight.
      {{ child_2 }} has one hand on the dragon's cheek and one foot already
      stepping backward into the portal, not yet ready to let go.
      {{ pet_1 }} sits pressed against the dragon's jaw, tail still.
