# ============================================================
# COVER PROMPTS — REFERENCE-ANCHORED STORYBOOK STYLE
# ============================================================

covers:
  front_cover:
    file: "front_cover_color.png"

    # CRITICAL: this is the image you uploaded that looks right
    style_reference_image: "src/scene_packs/cover_refs/princess_cover_reference.png"

    prompt: |
      Children’s picture-book FRONT COVER illustration.

      STYLE (MATCH REFERENCE IMAGE EXACTLY):
      Match the illustration style, texture, color treatment, proportions,
      and overall visual grammar of the provided reference image.
      This includes:
      - storybook gouache / airbrushed painterly finish
      - clean, confident edges on characters
      - softer, simplified background
      - subtle canvas or paper texture
      - saturated but clean colors (not pastel, not washed out)
      - large expressive eyes, rounded cheeks, slightly oversized heads
      - simplified, sturdy bodies (not thin, not floaty)

      Do NOT reinterpret the style.
      Do NOT switch to watercolor, pastel, or flat vector art.

      ------------------------------------------------------------
      CHARACTERS
      ------------------------------------------------------------
      {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
      must follow the same proportions, facial style, and rendering
      treatment as characters in the reference image.

      ------------------------------------------------------------
      COMPOSITION (FRONT COVER — PRINT SAFE)
      ------------------------------------------------------------

      Camera:
      Medium shot, knee-up framing.
      Eye-level camera.
      Characters are the largest and most detailed elements.

      Blocking:
      {{ child_names|join(' & ') }} stand close together as a unified pair.
      One child is slightly forward and centered (primary hero).
      The other child is slightly behind and overlapping at the shoulder (co-hero).
      Avoid perfect symmetry and equal spacing.

      Expression:
      Both children smile warmly and make direct eye contact with the viewer.

      Companion:
      {{ pet_names|join(' & ') }} appear small and supportive near the lower edge,
      clearly secondary and not competing with faces.

      Background:
      A colorful fantasy castle appears in the distance,
      clearly smaller and less detailed than the characters.
      Foreground grass and flowers are simple and uncluttered.

      Title-safe area:
      The top 35–40% of the image is clean open sky,
      reserved for title placement.
      Nothing may enter this area (no towers, birds, sparkles, dragons).

      Print rules:
      High contrast between characters and background.
      Keep all faces and important details well inside safety margins.
      No text in the artwork.

      STRICT NEGATIVES:
      - no text, letters, numbers, logos
      - no extra children or pets
      - no dramatic action poses or running
      - no vignette, frame, or border
      - no flat vector style
      - no watercolor bleed or pastel wash

  back_cover:
    file: "back_cover_color.png"

    # SAME reference image to lock style consistency
    style_reference_image: "src/scene_packs/cover_refs/princess_cover_reference.png"

    prompt: |
      Children’s picture-book BACK COVER illustration.

      STYLE (MATCH REFERENCE IMAGE EXACTLY):
      Match the illustration style, texture, color treatment,
      and character proportions of the provided reference image.
      Maintain visual continuity with the front cover.

      ------------------------------------------------------------
      CHARACTERS
      ------------------------------------------------------------
      {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
      must match the front cover exactly in appearance and style.

      ------------------------------------------------------------
      COMPOSITION (BACK COVER — QUIET & TEXT FRIENDLY)
      ------------------------------------------------------------

      Scene:
      {{ child_names|join(' & ') }} are seen from behind,
      walking side-by-side along a gentle path toward a distant castle.
      Their heads are close together, clearly connected.
      {{ pet_names|join(' & ') }} walk calmly beside them, small and secondary.

      Tone:
      Peaceful, story-continuing.
      No eye contact with the viewer.
      No dramatic gestures or action.

      Background:
      Rolling hills and a distant castle, softly simplified.
      Upper 50% of the image is clean open sky
      reserved for back-cover text.
      Bottom-right area is visually calm for ISBN barcode.

      Contrast:
      Slightly softer contrast and saturation than the front cover,
      but same color palette and style.

      Print rules:
      Keep all key elements inside safety margins.
      No text in the artwork.

      STRICT NEGATIVES:
      - no text, letters, numbers, logos
      - no extra characters or creatures
      - no dramatic lighting or storms
      - no vignette, frame, or border
      - no flat vector or watercolor styles



# ============================================================
# INTERIOR SCENES (SCENE ONLY — STYLE & BIBLE ADDED BY GENERATOR)
# ============================================================

scenes:
  - page: 2
    title: "Portal Discovery"
    prompt: |
      {{ child_names|join(' & ') }} discover a swirling magical portal in a bright, open forest clearing.
      Inside the portal are outline-only silhouettes of two friendly dragons.
      {{ pet_names|join(' & ') }} look up curiously.
      Environment: tall trees, mushrooms, ferns, and forest plants with lots of white space.
      Composition: portal in the upper half; kids and pets in the lower half.

  - page: 3
    title: "Dragon Hatchlings"
    prompt: |
      {{ child_names|join(' & ') }} kneel beside a nest of dragon eggs.
      Baby dragons peek out of cracked shells.
      {{ pet_names|join(' & ') }} watch sweetly.
      Environment: grass, flowers, and smooth stones with plenty of white space.
      Composition: nest in foreground; kids behind.

  - page: 4
    title: "Wizard’s Tower"
    prompt: |
      {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }} walk up a hill toward a tall wizard’s tower.
      A friendly dragon waves from a balcony.
      Environment: winding path, hills, clouds, and distant mountains.
      Composition: tower in upper area; characters lower area; open sky.

  - page: 5
    title: "Rainbow Bridge"
    prompt: |
      {{ child_names|join(' & ') }} cross a high arched bridge with {{ pet_names|join(' & ') }} close beside them.
      A friendly dragon flies alongside.
