# ============================================================
# DRAGON REALM SCENE PACK (DRY + MACRO VERSION)
# ============================================================

globals:


  # ------------------------------------------------------------
  # Global safety (auto-injected by generator)
  # ------------------------------------------------------------
  global_safety_rules: |
    - No object intersections or impossible overlaps.
    - Clean occlusion: if objects overlap, the front object clearly covers the back object.
    - No extra limbs, no duplicated faces, no merged hands/feet.
    - Keep dragons anatomically clean: one head, two wings (if winged), four limbs, one tail.
    - Keep shapes simple and readable for coloring.

  # ------------------------------------------------------------
  # Style fragments
  # ------------------------------------------------------------
  style_line_art: |
    Black-and-white children’s coloring-book line art.
    Clean black outlines on white.
    No shading, no gray, no gradients, no shadows.
    Avoid large filled-black regions; keep interiors open for coloring.

  style_classic: |
    STYLE: classic coloring-book illustration (NOT chibi).
    Natural child proportions. Clear facial expressions.

  style_action: |
    STYLE: classic kids’ coloring-book illustration (NOT chibi).
    Natural proportions with gentle action energy, but keep shapes simple and readable.

    cover:
    trim_width_in: 8.625
    trim_height_in: 11.25
    full_wrap_width_in: 17.25
    full_wrap_height_in: 11.25
    dpi: 300

  # FULL COLOR cover style
  cover_art_style: |
    Full-color, premium children’s fantasy book cover illustration.
    Rich, warm color palette with cinematic lighting and soft atmosphere.
    Clean, high-detail illustration with crisp edges (not blurry).
    NOT chibi. Natural child proportions, clear facial expressions.
    High-end storybook look (modern, elegant, magical).
    No watermark.

  # Keep predictable negative space for typography
  cover_comp_rules: |
    Provide clear negative space for typography:
    - Leave the top ~25% of the FRONT cover as mostly open sky/glow (low detail).
    - Do NOT draw frames, rectangles, title boxes, or bordered placeholders.
    - Do NOT draw any letters/words/symbols or fake text scribbles anywhere.

  # ------------------------------------------------------------
  # Composition fragments
  # ------------------------------------------------------------
  comp_medium_close: |
    FULL-PAGE COMPOSITION: medium-close framing.
    {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
    fill ~70–85% of page height.
    Avoid large blank sky.

  comp_vertical_dynamic: |
    FULL-PAGE COMPOSITION: dynamic vertical composition.
    {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
    fill most of the lower two-thirds.
    Key elements extend upward toward the top edge.

  comp_epic_upward: |
    FULL-PAGE COMPOSITION: dramatic upward composition.
    Main dragon wings extend near the top margin.
    Characters fill the lower half prominently.

  comp_flight_diagonal: |
    FULL-PAGE COMPOSITION: dynamic diagonal composition.
    One MAIN dragon fills ~80–85% of page height.
    Wings extend near the top margin (partial crop OK).

  # ------------------------------------------------------------
  # Front-matter overlay styles (auto-injected by generator)
  # ------------------------------------------------------------

  overlay_styles:
    title:
      font_path: "assets/fonts/Cinzel-VariableFont_wght.ttf"
      size: 260
      fill: "black"
      stroke_width: 2
      stroke_fill: "white"
      line_spacing: 1.02

    subtitle:
      font_path: "assets/fonts/CormorantGaramond-VariableFont_wght.ttf"
      size: 135
      fill: "black"
      stroke_width: 2
      stroke_fill: "white"
      line_spacing: 1.05

    dedication:
      font_path: "assets/fonts/CormorantGaramond-Italic-VariableFont_wght.ttf"
      size: 145
      fill: "black"
      stroke_width: 1
      stroke_fill: "white"
      line_spacing: 1.18

    cover_title:
      size: 520
      fill: "white"
      stroke_width: 6   
      stroke_fill: "black"

    cover_subtitle:
      size: 220
      fill: "white"
      stroke_width: 4
      stroke_fill: "black"

      cover_back_blurb:
        font_path: "assets/fonts/CormorantGaramond-VariableFont_wght.ttf"
        size: 120
        fill: "white"
        stroke_width: 5
        stroke_fill: "black"
        line_spacing: 1.25
        align: "center"
  # ------------------------------------------------------------
  # One-line reusable scene header (MOST IMPORTANT)
  # ------------------------------------------------------------
  base_scene_header: |
    {{ globals.style_line_art }}
    {{ globals.style_classic }}
    {{ globals.comp_medium_close }}

  base_scene_header_vertical: |
    {{ globals.style_line_art }}
    {{ globals.style_classic }}
    {{ globals.comp_vertical_dynamic }}

  base_scene_header_action: |
    {{ globals.style_line_art }}
    {{ globals.style_action }}
    {{ globals.comp_vertical_dynamic }}

  base_scene_header_epic: |
    {{ globals.style_line_art }}
    {{ globals.style_classic }}
    {{ globals.comp_epic_upward }}

  base_scene_header_flight: |
    {{ globals.style_line_art }}
    {{ globals.style_action }}
    {{ globals.comp_flight_diagonal }}

covers:

  front:
    title: "Front Cover Art"
    prefix: "cover"
    include_bible: true
    include_safety: true
    pixels: { w: 2550, h: 3300 }

    prompt: |
      {{ globals.cover_art_style }}

      FRONT COVER SCENE:
      {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }} in the foreground,
      discovering a swirling magical portal in a forest clearing.
      A large friendly dragon rises protectively behind them,
      wings subtly framing the composition.
      A distant castle silhouette beyond the trees.

      LIGHTING:
      The portal emits a soft golden magical glow that illuminates the children and dragon.
      The upper sky area should transition into a slightly darker twilight blue-violet gradient.
      Behind where the title will sit, create a gentle radiant halo glow in the sky.
      The glow should be soft, atmospheric, and cinematic — not neon or overpowering.

      COMPOSITION:
      Subjects fill the lower ~65–75% of the cover.
      Leave the top ~25% mostly open sky with low detail to allow typography to stand out.

      Do NOT draw any text.
      Do NOT draw placeholder boxes or frames.
      Do NOT draw fake lettering or symbols.

    overlays:
      - type: "text"
        style: "cover_title"
        content: "{{ child_names|join(' & ') }}"
        region_pct: { x: 8, y: 6, w: 84, h: 16 }

      - type: "text"
        style: "cover_subtitle"
        content: "The Dragon Realm Adventure"
        region_pct: { x: 10, y: 20, w: 80, h: 10 }
    
  back:
    title: "Back Cover Art"
    prefix: "cover"
    include_bible: false
    include_safety: true
    pixels: { w: 2550, h: 3300 }

    prompt: |
      {{ globals.cover_art_style }}

      BACK COVER SCENE:
      A whimsical magical dragon-realm landscape suitable for the back cover.
      Rolling hills, distant castle silhouette, glowing stars,
      subtle magical particles in the air, and gentle twilight sky.
      Include soft atmospheric depth and rich color, but keep composition calm and balanced.

      Leave the central area moderately open in case a small blurb is added later.
      Do NOT include the children or pets on the back cover.
      Do NOT draw any text.
      Do NOT draw placeholder boxes or frames.

    overlays: []

front_matter:
  - title: "Title Page"
    page: 0
    prefix: "front"
    include_bible: false
    include_safety: false
    prompt: |
      Black-and-white coloring-book line art. Clean outlines only. No shading.

      TITLE PAGE LAYOUT:
      Leave a very large blank centered area for the title.
      IMPORTANT: The title area must be blank white paper with NO box, NO border, NO rectangle, NO frame, NO lines.

      Add a small baby dragon and a small castle near the bottom.
      Do NOT draw any letters/words/symbols.

    overlays:
    - type: "text"
      style: "title"
      content: "{{ child_names|join(' & ') }}"
      region_pct: { x: 10, y: 18, w: 80, h: 14 }

    - type: "text"
      style: "subtitle"
      content: "The Dragon Realm Adventure"
      region_pct: { x: 10, y: 30, w: 80, h: 10 }

  - title: "Dedication Page"
    page: 1
    prefix: "front"
    include_bible: false
    include_safety: false
    prompt: |
      Black-and-white coloring-book line art. Clean outlines only. No shading.
      Leave a very large blank center area for dedication text (DO NOT draw text).
      Add a simple thin border of vines and stars.
      IMPORTANT: Do NOT draw any letters/words/symbols. Keep center blank.

    overlays:
      - type: "text"
        style: "dedication"
        content: "For {{ child_names|join(' & ') }}—\nmay your imaginations always soar."
        region_pct: { x: 15, y: 38, w: 70, h: 24 }

# ============================================================
# SCENES
# ============================================================

scenes:

  - page: 2
    title: "Portal Discovery"
    prompt: |
      {{ globals.base_scene_header }}

      SCENE:
      In a forest clearing, {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
      discover a swirling magical portal behind them.
      The portal is large and reaches toward the top edge.
      Inside the portal, outline-only silhouettes of two friendly winged dragons are visible.
      Tall trees and hanging vines frame the upper area.

  - page: 3
    title: "Dragon Hatchlings"
    prompt: |
      {{ globals.base_scene_header }}

      SCENE:
      {{ child_names|join(' & ') }} kneel beside a large nest of dragon eggs.
      Several baby flame dragons peek from cracked shells.
      {{ pet_names|join(' & ') }} watches nearby.

  - page: 4
    title: "The Sky Bridge"
    prompt: |
      {{ globals.base_scene_header_vertical }}

      SCENE:
      {{ child_names|join(' & ') }} walk across a floating stone bridge.
      Above them coils a long cloud-serpent dragon with whiskers and flowing mane.
      Puffy clouds frame the top portion of the page.

  - page: 5
    title: "Forest Dragons"
    prompt: |
      {{ globals.base_scene_header }}

      SCENE:
      In a magical grove, {{ child_names|join(' & ') }} meet a forest dragon
      with leaf-shaped wings and branch-like antlers.
      {{ pet_names|join(' & ') }} sits near the foreground grass.

  - page: 6
    title: "Dragon Training Grounds"
    prompt: |
      {{ globals.base_scene_header_action }}

      SCENE:
      In an open courtyard, young dragons practice gentle fire puffs
      into floating ring targets.
      A sleek ninja-style dragon leaps between rooftops in the background.
      Keep rings clean and circular.

  - page: 7
    title: "Crystal Valley"
    prompt: |
      {{ globals.base_scene_header_vertical }}

      SCENE:
      {{ child_names|join(' & ') }} stand in a valley filled with large crystal formations.
      An ice dragon with icicle-shaped horns stands on a crystal ledge.

  - page: 8
    title: "Dragon Festival"
    prompt: |
      {{ globals.base_scene_header_vertical }}

      SCENE:
      A joyful dragon festival.
      Baby dragons play around {{ child_names|join(' & ') }}.
      A long cloud-serpent dragon arches overhead.
      Hanging lanterns fill the upper space.

  - page: 9
    title: "The Guardian Dragon"
    prompt: |
      {{ globals.base_scene_header_epic }}

      SCENE:
      On a grand stone plateau, {{ child_names|join(' & ') }}
      stand before a majestic elder guardian dragon.
      The dragon spreads its wings protectively.

      PROP RULE:
      If a sword is present, it MUST be fully inside a clearly drawn scabbard.
      The scabbard hangs from the belt at the hip.
      No sword piercing through belt.

  - page: 10
    title: "Double Dragon Flight"
    prompt: |
      {{ globals.base_scene_header_flight }}

      SCENE:
      {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
      ride together on ONE large friendly flame dragon.
      A SECOND dragon flies in the distant background (no riders).
      Children sit securely on a visible saddle.
      {{ pet_names|join(' & ') }} is secured safely between them.

  - page: 11
    title: "Goodbye, Dragon Realm"
    prompt: |
      {{ globals.base_scene_header }}

      SCENE:
      Back in the forest clearing, {{ child_names|join(' & ') }}
      wave goodbye at the glowing portal.
      A tiny baby dragon peeks from inside.
      Keep portal glow outline-only.