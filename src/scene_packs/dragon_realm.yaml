      SCENE: {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }} walk up a winding path toward a tall wizard’s tower.
      The tower rises behind them and extends near the top edge (outline-only windows/stone blocks). A friendly dragon waves from a mid-level balcony.
