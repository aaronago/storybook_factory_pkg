# ============================================================
# DRAGON REALM — REUSABLE SCENE PACK (OPTIMIZED FOR FULL-PAGE INTERIORS)
# ============================================================

# ============================================================
# COVER PROMPTS — KEEP AS-IS (YOUR EXISTING REFERENCE-ANCHORED SETUP)
# ============================================================
covers:
  front_cover:
    file: "front_cover_color.png"
    style_reference_image: "src/scene_packs/cover_refs/princess_cover_reference.png"
    prompt: |
      Children’s picture-book FRONT COVER illustration.

      STYLE (MATCH REFERENCE IMAGE EXACTLY):
      Match the illustration style, texture, color treatment, proportions,
      and overall visual grammar of the provided reference image.
      This includes:
      - storybook gouache / airbrushed painterly finish
      - clean, confident edges on characters
      - softer, simplified background
      - subtle canvas or paper texture
      - saturated but clean colors (not pastel, not washed out)
      - large expressive eyes, rounded cheeks, slightly oversized heads
      - simplified, sturdy bodies (not thin, not floaty)

      Do NOT reinterpret the style.
      Do NOT switch to watercolor, pastel, or flat vector art.

      ------------------------------------------------------------
      CHARACTERS
      ------------------------------------------------------------
      {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
      must follow the same proportions, facial style, and rendering
      treatment as characters in the reference image.

      ------------------------------------------------------------
      COMPOSITION (FRONT COVER — PRINT SAFE)
      ------------------------------------------------------------

      Camera:
      Medium shot, knee-up framing.
      Eye-level camera.
      Characters are the largest and most detailed elements.

      Blocking:
      {{ child_names|join(' & ') }} stand close together as a unified pair.
      One child is slightly forward and centered (primary hero).
      The other child is slightly behind and overlapping at the shoulder (co-hero).
      Avoid perfect symmetry and equal spacing.

      Expression:
      Both children smile warmly and make direct eye contact with the viewer.

      Companion:
      {{ pet_names|join(' & ') }} appear small and supportive near the lower edge,
      clearly secondary and not competing with faces.

      Background:
      A colorful fantasy castle appears in the distance,
      clearly smaller and less detailed than the characters.
      Foreground grass and flowers are simple and uncluttered.

      Title-safe area:
      The top 35–40% of the image is clean open sky,
      reserved for title placement.
      Nothing may enter this area (no towers, birds, sparkles, dragons).

      Print rules:
      High contrast between characters and background.
      Keep all faces and important details well inside safety margins.
      No text in the artwork.

      STRICT NEGATIVES:
      - no text, letters, numbers, logos
      - no extra children or pets
      - no dramatic action poses or running
      - no vignette, frame, or border
      - no flat vector style
      - no watercolor bleed or pastel wash

  back_cover:
    file: "back_cover_color.png"
    style_reference_image: "src/scene_packs/cover_refs/princess_cover_reference.png"
    prompt: |
      Children’s picture-book BACK COVER illustration.

      STYLE (MATCH REFERENCE IMAGE EXACTLY):
      Match the illustration style, texture, color treatment,
      and character proportions of the provided reference image.
      Maintain visual continuity with the front cover.

      Composition:
      A simple, warm vignette with {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
      in the lower 2/3 of the page, with a clean, uncluttered area reserved for back-cover text
      (leave room but do NOT include text).

      STRICT NEGATIVES:
      - no text, letters, numbers, logos
      - no extra children or pets


# ============================================================
# INTERIOR SCENES — OPTIMIZED FOR: FULL-PAGE, LESS CHIBI, LESS VERTICAL WHITESPACE
# ============================================================
scenes:
  - page: 2
    title: "Portal Discovery"
    prompt: |
      Black-and-white children’s coloring-book line art. Clean black outlines on white. No shading, no gray, no gradients, no shadows. Avoid large filled-black regions; keep interiors open for coloring.

      STYLE: classic children’s coloring-book illustration (NOT chibi). Slightly more natural kid proportions: moderate head size, smaller eyes than chibi, clear facial features, simple but believable clothing folds.

      FULL-PAGE COMPOSITION: medium-close framing. {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }} fill ~70–85% of page height. Heads near the top margin and feet/foreground near the bottom margin (cropping is OK). Avoid large blank sky.

      SCENE: In a forest clearing, the kids discover a swirling magical portal.
      Put the portal behind and slightly above them, large and prominent, with outline-only silhouettes of two friendly dragons inside.
      Add outline-only framing elements that reach near the top: treetops, hanging vines, tall mushrooms/ferns. Add foreground grass/rocks at the bottom.

  - page: 3
    title: "Dragon Hatchlings"
    prompt: |
      Black-and-white coloring-book line art. Clean black outlines only. No shading/gray/gradients. No big filled blacks.

      STYLE: classic kids’ coloring-book illustration (NOT chibi), moderately sized eyes, simple crisp linework.

      FULL-PAGE COMPOSITION: medium-close. Main group fills ~70–85% of page height. Bring the nest and characters closer to camera; reduce empty background.

      SCENE: {{ child_names|join(' & ') }} kneel beside a nest of dragon eggs in the foreground.
      Baby dragons peek from cracked shells. {{ pet_names|join(' & ') }} watches sweetly near the bottom edge.
      Background framing: big leaves/flowers and a few tall stones rising toward the top edge, leaving white spaces between elements for coloring.

  - page: 4
