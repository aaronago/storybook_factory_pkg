# ============================================================
# DRAGON REALM SCENE PACK (DRY + MACRO VERSION)
# ============================================================

globals:
  # ------------------------------------------------------------
  # Global safety (auto-injected by generator)
  # ------------------------------------------------------------
  global_safety_rules: |
    - No object intersections or impossible overlaps.
    - Clean occlusion: if objects overlap, the front object clearly covers the back object.
    - No extra limbs, no duplicated faces, no merged hands/feet.
    - Keep dragons anatomically clean: one head, two wings (if winged), four limbs, one tail.
    - Keep shapes simple and readable for coloring.

  # ------------------------------------------------------------
  # Style fragments
  # ------------------------------------------------------------
  style_line_art: |
    Black-and-white children’s coloring-book line art.
    Clean black outlines on white.
    No shading, no gray, no gradients, no shadows.
    Avoid large filled-black regions; keep interiors open for coloring.

  style_classic: |
    STYLE: classic coloring-book illustration (NOT chibi).
    Natural child proportions. Clear facial expressions.

  style_action: |
    STYLE: classic kids’ coloring-book illustration (NOT chibi).
    Natural proportions with gentle action energy, but keep shapes simple and readable.

  cover_art_style: |
    Full-color, premium children’s fantasy book cover illustration.
    High-end animated feature film lighting (Pixar-style fantasy cool).

    COLOR DIRECTION:
    - World lighting = cool twilight blues, indigo, and soft violet.
    - Shadows lean blue-violet or teal, NOT brown or orange.
    - Portal glow = warm golden key light with soft falloff.
    - Strong warm–cool contrast between portal light and forest atmosphere.
    - Background should feel cool and magical, not sepia or sunset-orange.

    LIGHTING STYLE:
    - Cinematic global illumination.
    - Soft rim lighting separating characters from background.
    - Subtle cool moonlight or sky fill balancing the warm portal light.
    - Warm light affects only nearby surfaces; avoid flooding entire scene with orange.

    RENDERING:
    - Painterly but polished.
    - Smooth gradients and volumetric glow.
    - No heavy black contour lines.
    - Edges defined by light and color transitions, not outlines.

    HARD RULES:
    - NOT a coloring book page.
    - No outline-only rendering.
    - No large white fill areas.
    - Maintain full color depth and dynamic lighting.

    NOT chibi. Natural child proportions, expressive faces.
    Modern animated-feature aesthetic.
    No watermark.

  # Keep predictable negative space for typography
  cover_comp_rules: |
    Provide clear negative space for typography:
    - Leave the top ~25% of the FRONT cover as mostly open sky/glow (low detail).
    - Do NOT draw frames, rectangles, title boxes, or bordered placeholders.
    - Do NOT draw any letters/words/symbols or fake text scribbles anywhere.

  # ------------------------------------------------------------
  # Composition fragments
  # ------------------------------------------------------------
  comp_medium_close: |
    FULL-PAGE COMPOSITION: medium-close framing.
    {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
    fill ~70–85% of page height.
    Avoid large blank sky.

  comp_vertical_dynamic: |
    FULL-PAGE COMPOSITION: dynamic vertical composition.
    {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
    fill most of the lower two-thirds.
    Key elements extend upward toward the top edge.

  comp_epic_upward: |
    FULL-PAGE COMPOSITION: dramatic upward composition.
    Main dragon wings extend near the top margin.
    Characters fill the lower half prominently.

  comp_flight_diagonal: |
    FULL-PAGE COMPOSITION: dynamic diagonal composition.
    One MAIN dragon fills ~80–85% of page height.
    Wings extend near the top margin (partial crop OK).

  # ------------------------------------------------------------
  # Front-matter overlay styles (auto-injected by generator)
  # ------------------------------------------------------------

  overlay_styles:
    dedication:
      font_path: 'assets/fonts/CormorantGaramond-Italic-VariableFont_wght.ttf'
      size: 145
      fill: 'black'
      stroke_width: 1
      stroke_fill: 'white'
      line_spacing: 1.18

  # ------------------------------------------------------------
  # One-line reusable scene header (MOST IMPORTANT)
  # ------------------------------------------------------------
  base_scene_header: |
    {{ globals.style_line_art }}
    {{ globals.style_classic }}
    {{ globals.comp_medium_close }}

  base_scene_header_vertical: |
    {{ globals.style_line_art }}
    {{ globals.style_classic }}
    {{ globals.comp_vertical_dynamic }}

  base_scene_header_action: |
    {{ globals.style_line_art }}
    {{ globals.style_action }}
    {{ globals.comp_vertical_dynamic }}

  base_scene_header_epic: |
    {{ globals.style_line_art }}
    {{ globals.style_classic }}
    {{ globals.comp_epic_upward }}

  base_scene_header_flight: |
    {{ globals.style_line_art }}
    {{ globals.style_action }}
    {{ globals.comp_flight_diagonal }}

covers:
  front:
  title: 'Front Cover Art'
  prefix: 'cover'
  include_bible: true
  include_safety: true
  pixels: { w: 2588, h: 3375 }
  prompt: |
    {{ globals.cover_art_style }}

    Rendering must feel like a frame from a high-end animated fantasy film.

    FRONT COVER SCENE:
    {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }} in the foreground,
    discovering a swirling magical portal in a forest clearing.
    A large friendly dragon rises protectively behind them,
    wings subtly framing the composition.
    A distant castle silhouette beyond the trees.

    LIGHTING:
    The forest environment should be cool twilight blue and indigo.
    Add subtle cool moonlight or sky glow from above/behind.
    The portal emits a soft golden magical light that illuminates faces and nearby ground.
    Keep warm light localized — do NOT turn the entire scene orange.
    Add gentle cool-violet shadow tones in unlit areas.
    Add slight teal undertones in darker forest areas for depth.

    ATMOSPHERE:
    Soft volumetric glow around the portal.
    Light mist or particles catching cool blue light in the distance.
    Maintain strong warm–cool color separation.

    COMPOSITION:
    Subjects fill the lower ~65–70% of the cover.
    Reserve the upper ~30–35% as open cool-toned sky for title placement.
    Keep this upper area clean and uncluttered (no branches or wings behind text).

    TITLE PLACEMENT RULES:
    Include the exact title text:
    The Dragon Realm Adventure

    The title must sit comfortably inside the safe zone.
    Leave a generous clear margin above the word “The”.
    The top of the title block must not approach the trim edge.
    Ensure visible breathing room between the top of the cover and the title.

    Center the title horizontally in the upper sky area.
    Position the entire title block slightly lower than the very top —
    never tight to the edge.

    Use elegant fantasy serif typography.
    Gold-ivory lettering with subtle bevel and soft warm glow.
    Professional book-cover quality.
    Clean, readable letterforms.
    Correct spelling is critical.
    Do not distort letters.
    Do not add extra words.
    No other text anywhere on the cover.

    Do NOT draw placeholder boxes or frames.
    Do NOT draw fake lettering or symbols.

  back:
    title: 'Back Cover Art'
    prefix: 'cover'
    include_bible: false
    include_safety: true
    pixels: { w: 2588, h: 3375 }
    prompt: |
      {{ globals.cover_art_style }}

      BACK COVER SCENE:
      A whimsical magical dragon-realm landscape suitable for the back cover.
      Rolling hills, distant castle silhouette, glowing stars,
      subtle magical particles in the air, and gentle twilight sky.
      Include soft atmospheric depth and rich color, but keep composition calm and balanced.

      Leave the central area moderately open in case a small blurb is added later.
      Do NOT include the children or pets on the back cover.
      Do NOT draw any text.
      Do NOT draw placeholder boxes or frames.

front_matter:
  - title: 'Dedication Page'
    page: 1
    prefix: 'front'
    include_bible: false
    include_safety: false
    prompt: |
      Black-and-white coloring-book line art. Clean outlines only. No shading.
      Leave a very large blank center area for dedication text (DO NOT draw text).
      Add a simple thin border of vines and stars.
      IMPORTANT: Do NOT draw any letters/words/symbols. Keep center blank.

    overlays:
      - type: 'text'
        style: 'dedication'
        content: "For {{ child_names|join(' & ') }}—\nmay your imaginations always soar."
        region_pct: { x: 15, y: 38, w: 70, h: 24 }

# ============================================================
# SCENES
# ============================================================

scenes:
  - page: 2
    title: 'Portal Discovery'
    prompt: |
      {{ globals.base_scene_header }}

      SCENE:
      In a forest clearing, {{ child_names|join(' & ') }} and {{ pet_names|join(' & ') }}
      discover a swirling magical portal behind them.
      The portal is large and reaches toward the top edge.
      Inside the portal, outline-only silhouettes of two friendly winged dragons are visible.
      Tall trees and hanging vines frame the upper area.

  - page: 3
    title: 'Dragon Hatchlings'
    prompt: |
      {{ globals.base_scene_header }}

      SCENE:
      {{ child_names|join(' & ') }} kneel beside a large nest of dragon eggs.
      A baby dragon peeks from a cracked shell. The other eggs are whole and unhatched.
      {{ pet_names|join(' & ') }} watches nearby.

  - page: 4
    title: 'The Sky Bridge'
    prompt: |
      {{ globals.base_scene_header_vertical }}

      SCENE:
      {{ child_names|join(' & ') }} walk across a floating stone bridge.
      Above them coils a long cloud-serpent dragon with whiskers and flowing mane.
      Puffy clouds frame the top portion of the page.

  - page: 5
    title: 'Forest Dragons'
    prompt: |
      {{ globals.base_scene_header }}

      SCENE:
      In a magical grove, {{ child_names|join(' & ') }} meet a forest dragon
      with leaf-shaped wings and branch-like antlers.
      {{ pet_names|join(' & ') }} sits near the foreground grass.

  - page: 6
    title: 'Dragon Training Grounds'
    prompt: |
      {{ globals.base_scene_header }}

      SCENE:
      {{ child_names }} and {{ pet_names }} stand a few steps in front of one strong young dragon.

      The dragon is slightly taller than the children,
      standing upright with wings partially open.
      It looks focused and alert, not babyish and not aggressive.

      {{ child_names }} are interacting confidently:
      - One child reaches a hand toward the dragon’s shoulder.
      - The other stands ready, watching closely.

      {{ pet_names }} stands beside them on the ground,
      looking up at the dragon.

      In the background:
      Simple stone walls and a few training targets.
      Large open sky above.
      Keep shapes bold and readable.

  - page: 7
    title: 'The Thunder Dragon'
    prompt: |
      {{ base_scene_header }}

      SCENE:
      On a rocky hill beneath large rolling storm clouds,
      {{ child_names|join(' & ') }} stand side by side,
      steady and brave in the wind.
      {{ pet_names|join(' & ') }} stands at their feet.

      Above them, a powerful thunder dragon sweeps across the sky
      in a strong diagonal arc.

      The thunder dragon has lightning-shaped horns
      and broad angular wings.
      Its expression is intense but noble.

      A bold bolt of lightning bursts from the dragon’s mouth,
      branching naturally in thick, flowing lines.

      Keep cloud shapes large and dramatic.
      Emphasize strong diagonal movement.
      Avoid small repeated textures.
      Keep silhouettes clean and bold for coloring.
  - page: 8
    title: 'Frostfall Peaks'
    prompt: |
      {{ globals.base_scene_header_vertical }}

      SCENE:
      High in the snowy mountains, {{ child_names|join(' & ') }}
      climb a gentle icy slope.

      A majestic ice dragon with crystalline horns
      and jagged frost-covered wings perches on a snowy ridge.

      Large snowdrifts and angular ice formations
      frame the lower and side edges of the page.

      Keep shapes bold and clean.
      Avoid tiny snowflake details.
  - page: 9
    title: 'The Ocean Dragon'
    prompt: |
      {{ globals.base_scene_header_vertical }}

      SCENE:
      On a wide sandy shore, {{ child_names|join(' & ') }} stand at the water’s edge.
      Gentle ocean waves roll toward them.

      A majestic ocean dragon rises gracefully from the sea.
      The dragon has fin-like wings, a long flowing body,
      and coral-shaped horns.

      Keep the shoreline calm and spacious.
      Use broad, smooth wave lines with minimal internal detail.
      Do NOT create face-like shapes in the water.
      Avoid eye-like or mouth-like foam patterns.
      Keep wave crests abstract and flowing.

      The horizon line stays simple and clean.

  - page: 10
    title: 'The Moonlight Dragon'
    prompt: |
      {{ globals.base_scene_header_vertical }}

      SCENE:
      In a glowing moonlit meadow,
      {{ child_names|join(' & ') }} look up at a graceful moonlight dragon.
      {{ pet_names|join(' & ') }} sits calmly beside them in the foreground.

      The dragon has long flowing wings
      and crescent-shaped horns.

      Large rounded moon shapes and smooth rolling hills
      frame the background.

      Keep lines bold and avoid tiny star clutter.

  - page: 11
    title: 'Dragon Flight'
    prompt: |
      {{ base_scene_header_flight }}


      FULL-PAGE COMPOSITION:
      Strong diagonal flight composition.
      One large flame dragon flies from lower-left toward upper-right.
      Keep the sky open and spacious.
      Avoid crowding the dragon.

      SCENE:
      {{ child_names|join(' & ') }}
      ride together on one majestic flame dragon high above a wide valley.

      The children lean slightly with the motion of flight.
      Hair and clothing stream gently backward in the wind.

      The flame dragon looks powerful and noble.
      Wings fully extended.
      Head forward in confident motion.

      Far below, {{ pet_names|join(' & ') }}
      runs along a winding path beside the river,
      looking up toward the flying dragon.

      The valley below is simple:
      rolling hills, a winding river, distant mountains.

  - page: 12
    title: 'The Lost Flame Dragon'
    prompt: |
      {{ base_scene_header }}


      FULL-PAGE COMPOSITION:
      Vertical composition.
      The dragon stands in the center of the page.
      Leave open space around the characters for clarity.

      SCENE:
      A flame dragon stands alone in a forest clearing,
      looking uncertain and slightly worried.

      {{ child_names|join(' & ') }} approach the dragon gently.
      One child reaches out a hand in reassurance.
      {{ pet_names|join(' & ') }} stands beside them.

      The dragon is clearly reptilian and proportional.
      Keep the pose simple and grounded.
      No tangled vines or complex overlaps.

      Keep the background minimal with a few trees and rocks.
      Maintain clean, readable shapes for coloring.

  - page: 13
    title: 'Grateful Flame Dragon'
    prompt: |
      {{ globals.base_scene_header }}

      SCENE:
      {{ child_names|join(' & ') }} stand beside a majestic flame dragon.

      {{ pet_names|join(' & ') }} stands between them.

      Include exactly one {{ pet_names|join(' & ') }}.
      Do NOT duplicate the pet.

      The dragon lowers its head in a gesture of gratitude.
      Keep the pose calm and grounded.

  - page: 14
    title: 'The Dragon Alliance'
    prompt: |
      {{ globals.base_scene_header }}

      SCENE:
      A large flame dragon stands proudly at the center,
      wings raised in a wide V shape.

      {{ child_names|join(' & ') }} stand confidently in front of the dragon,
      one slightly ahead of the other.
      {{ pet_names|join(' & ') }} stands between them.

      In the background, three other dragons
      (forest dragon, ice dragon, cloud-serpent dragon)
      perch separately on tall rock spires,
      forming a wide arc behind the central dragon.

      Keep each dragon clearly separated.
      Do not overlap wings between different dragons.

  - page: 15
    title: 'Goodbye, Dragon Realm'
    prompt: |
      {{ globals.base_scene_header }}

      FULL-PAGE COMPOSITION:
      Gentle centered composition with soft framing trees.

      SCENE:
      Back in the forest clearing,
      {{ child_names|join(' & ') }} stand side by side,
      holding hands.

      {{ pet_names|join(' & ') }} sits between them.

      Inside the glowing portal,
      a majestic flame dragon stands in silhouette,
      wings partially open.

      The dragon lowers its head in a final gesture of respect.

      The portal light softly illuminates the children's faces.

      Keep the scene calm and uncluttered.
      Emphasize emotion over action.

  - page: 16
    title: 'Memory Page'
    prompt: |
      {{ globals.style_line_art }}
      {{ globals.style_classic }}

      PERSONAL MEMORY PAGE – calm and sentimental.

      LAYOUT:
      Balanced vertical composition with generous negative space.

      At the top, include simple outlined lettering:
      "{{ child_names|join(' & ') }}'s Dragon Realm Memories"

      Below the title, create a large open rectangular drawing space
      occupying 60–70% of the page height.

      Add a thin decorative border of small stars and dragon-scale motifs.

      In the lower-left corner,
      include a small full-body portrait of {{ child_names|join(' & ') }}
      in their medieval outfits.

      Do NOT include any dragons on this page.
      Keep the design minimal and calm.
